# Publica el sitio en GitHub Pages desde la rama main:
#   raíz   → web pública + portal de clientes (apps/web)
#   /admin → admin interno (apps/admin)
# Solo main publica, para que lo que se prueba en development no pise el sitio en vivo.
# Requisitos (ya configurados): Settings → Pages → Source: "GitHub Actions" y el entorno
# github-pages con la rama main permitida.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Armar el sitio
        run: |
          mkdir -p _site/admin
          cp -r apps/web/out/. _site/
          cp -r apps/admin/out/. _site/admin/
          # sin esto GitHub ignora la carpeta _next
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
