<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>(brosbefore)™ — Fotografía y film de bodas</title>
  <meta name="description" content="No es solo un día. Es una historia. Su historia. Fotografía y film de bodas." />
  <link rel="icon" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>try{var t=localStorage.getItem("bb-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- el loader se muestra una vez por sesión -->
  <script>try{if(sessionStorage.getItem("bb-intro"))document.documentElement.classList.add("no-intro")}catch(e){}</script>
  <link rel="preload" as="image" href="assets/intro.webp" type="image/webp" />
</head>
<body class="home" data-page="inicio">
  <div class="loader" id="loader" role="progressbar" aria-label="Cargando" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <img class="loader__img" src="assets/intro.webp" alt="" fetchpriority="high" />
    <div class="loader__center">
      <img class="loader__logo" src="assets/logo.svg" alt="(brosbefore)™" />
      <p class="loader__tag">No es solo un día. Es una historia.</p>
    </div>
    <div class="loader__bottom">
      <span>Fotografía y film de bodas</span>
      <span class="loader__count" id="loaderCount">000</span>
    </div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
  </div>

  <main>
    <div class="stage" id="stage" aria-label="Trabajos"></div>

    <div class="hud" aria-live="polite">
      <div>
        <div class="hud__title" id="hudTitle"></div>
        <div class="hud__meta eyebrow" id="hudMeta"></div>
      </div>
      <div class="hud__right">
        <div class="hud__count" id="hudCount"></div>
        <div class="hud__hint">Scroll para explorar · click para ver</div>
      </div>
    </div>

    <button class="sound" id="soundToggle" aria-pressed="true" aria-label="Sonido">
      <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sound__label">Sonido</span>
    </button>

    <aside class="detail" id="detail" aria-hidden="true" data-nav-scroll>
      <div class="detail__inner" id="detailInner"></div>
    </aside>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/data.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
